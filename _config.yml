# =========================================
# SITE CONFIGURATION
# =========================================
title: Chronicle Destiny
description: A fast, responsive, and accessible documentation site.
url: "https://example.com"
baseurl: ""
logo: logo.svg

# =========================================
# THEME UI ICONS
# =========================================
toc_icon: "📖"
theme_icon_light: "☀️"
theme_icon_dark: "🌙"

# =========================================
# JEKYLL CORE
# =========================================
markdown: kramdown
highlighter: rouge
permalink: /:title/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# =========================================
# BUILD
# =========================================
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - README.md


# Build settings
remote_theme: zbule/theme
plugins:
  - jekyll-feed

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
